description: 'The Raspberry Pi based Grovator controller (the sensor list calls it the ''RPI'' controller): USB, Ethernet, HDMI and
  green screw terminals. Terminal labels come from four photos (not confirmed); the pin rules come from the sensor list. Its GPIO numbers
  are Raspberry Pi numbers and do NOT match the ESP32 kit''s pins.'
