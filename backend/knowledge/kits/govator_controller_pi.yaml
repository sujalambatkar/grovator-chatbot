documented_facts:
- 'Pin connection rules from the sensor list: digital GPIO 4, 7, 8, 16, 17, 18, 20, 21, 24, 25, 27, 10, 9, 11; analog AI1 to AI4; I2C
  SCL and SDA; UART RX and TX; relay GPIO22 and GPIO23.'
- 'Sensors connect by interface: digital sensors to any digital GPIO pin, analog sensors to AI1 to AI4, I2C sensors to the SDA and SCL
  pins, UART sensors to RX and TX.'
- Terminal labels read from photos (not confirmed).
not_documented:
- Any mapping between this controller's GPIO numbers and the ESP32 kit's pins (e.g. GPIO22 is a relay here, but I2C SCL on the ESP32
  kit).
- Which exact terminal each sensor of the sensor list uses (the list says 'any digital GPIO pin', 'any SDA pin').
