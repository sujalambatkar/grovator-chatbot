id: ultrasonic_sensor
name: Ultrasonic Sensor
aliases:
- ultrasonic sensor
- ultrasonic
- distance sensor
category: Input
working: Measures distance with sound. It sends high-frequency pulses from TRIG and listens for the echo on ECHO; the program times the echo and
  works out the distance in centimetres.
example_code: Ultrasonicsensor.py.py
gateway_key: ultrasonic_sensor
description: Measures distance with sound.
sensor_type: INPUT
