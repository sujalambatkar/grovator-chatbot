id: vibration_sensor
name: Vibration Sensor
aliases:
- vibration sensor
category: Input
working: 'Measures the strength of vibrations or shocks. Its output voltage changes with the vibration, read through an analog input:
  more vibration gives a higher reading. (The ESP32 gateway dataset lists it as digital D0: see GAPS.md.)'
example_code: Vibration.py.py
gateway_key: vibration_sensor
description: Measures the strength of vibrations or shocks.
sensor_type: INPUT
interface: analog
kit_connections:
- kit: govator_controller_pi
  interface: analog
  pins:
  - pin: VCC
    connects_to: 3-5V
  - pin: GND
    connects_to: GND
  - pin: Signal
    connects_to: Analog input (AI1, AI2, AI3, AI4)
  note: ''
